name: CI

# Both workflows fire on the same push to main, so without a run name the
# Actions list shows two rows with an identical title. The prefix says which
# one is which before the commit subject.
run-name: "CI · ${{ github.event_name == 'pull_request' && format('PR #{0} — {1}', github.event.number, github.event.pull_request.title) || github.event.head_commit.message }}"

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Scaffolder smoke test
        run: bun run smoke

      - name: Generated projects install, typecheck and lint
        run: bun run verify

      - name: Shared gitignore has not drifted
        run: |
          if ! diff -q .gitignore templates/_shared/gitignore > /dev/null; then
            echo "::error::.gitignore and templates/_shared/gitignore differ. Generated projects would get the wrong file."
            diff .gitignore templates/_shared/gitignore || true
            exit 1
          fi

      - name: Bundle is up to date
        run: |
          bun run build
          if ! git diff --quiet -- bin/create-stack.mjs; then
            echo "::error::bin/create-stack.mjs is stale. Run 'bun run build' and commit the result."
            git diff --stat -- bin/create-stack.mjs
            exit 1
          fi

  node-compat:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["18", "22", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Scaffold with plain Node (no Bun installed)
        run: |
          node bin/create-stack.mjs "${RUNNER_TEMP}/node-check" --template next --yes
          test -f "${RUNNER_TEMP}/node-check/package.json"
          test -f "${RUNNER_TEMP}/node-check/.gitignore"
