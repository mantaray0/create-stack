name: Release

# Changesets drives releases: pushing to main opens or updates a
# "Version Packages" pull request that collects the pending changesets.
# Merging that pull request publishes to npm, which is what makes
# `bunx @mantaray0/create-stack` resolve the new version.
#
# Authentication is npm trusted publishing (OIDC) — no token is stored here.
# npm is deprecating 2FA-bypassing access tokens: they lose account management
# rights in August 2026 and direct publish rights around January 2027, so a
# token-based release would stop working. Trusted publishing keeps working
# even with "require two-factor authentication and disallow tokens" enabled.
#
# This requires a one-time setup on npmjs.com — see "Releasing" in README.md.
# The workflow file name registered there must stay "release.yml".
on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # Mints the OIDC token npm verifies. Trusted publishing fails without it.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Changesets compares against the base branch, so it needs history.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      # Deliberately without `registry-url`: that option makes setup-node write
      # an .npmrc containing `_authToken=${NODE_AUTH_TOKEN}` and default
      # NODE_AUTH_TOKEN to the placeholder "XXXXX-XXXXX-XXXXX-XXXXX". npm would
      # then authenticate with that bogus token instead of exchanging an OIDC
      # token, and the publish fails with E404. Without the option no .npmrc is
      # written, npm falls back to the default registry and uses OIDC.
      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node >= 22.14.0.
          node-version: "24"

      # Trusted publishing needs npm >= 11.5.1. Upgrading explicitly keeps the
      # release independent of whichever npm the Node image happens to bundle.
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@latest

      - run: bun install --frozen-lockfile

      - name: Verify before releasing
        run: |
          bun run lint
          bun run typecheck
          bun run smoke

      - uses: changesets/action@v1
        id: changesets
        with:
          version: bun run changeset:version
          publish: bun run changeset:publish
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NPM_TOKEN on purpose: changesets/action falls back to trusted
          # publishing via OIDC when it finds none. Provenance is generated
          # automatically in that mode, so NPM_CONFIG_PROVENANCE is not needed.

      # npm never validates a trusted publisher entry when it is saved, so a
      # wrong field stays invisible until a release fails — and it then fails as
      # a bare ENEEDAUTH, because npm's OIDC helper swallows every reason it
      # gives up. Replay the exchange to make the failure name its own cause.
      - name: Explain a failed publish
        if: failure() && steps.changesets.outcome == 'failure'
        run: |
          echo "npm $(npm --version), node $(node --version)"
          node .github/scripts/diagnose-trusted-publishing.mjs

      # Guard against npm/GitHub drift: a version on npm without a matching git
      # tag means a publish bypassed `changeset publish` (the 0.1.0 incident —
      # manual `npm publish` shipped without tag or GitHub release). Fail loudly
      # instead of letting the gap go unnoticed. Only meaningful after an actual
      # publish — on the pushes that merely open the version pull request,
      # package.json still holds the previously released version.
      - name: Verify the published version has a git tag
        if: steps.changesets.outputs.published == 'true'
        run: |
          tag="$(node -p 'const p=require("./package.json");`${p.name}@${p.version}`')"
          git fetch --tags origin
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag is on npm but has no git tag. Recover with: bunx changeset tag && git push --tags, then gh release create $tag"
            exit 1
          fi
          echo "Tag $tag is present — npm and GitHub are in sync."
