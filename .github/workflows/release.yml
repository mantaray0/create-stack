name: Release

# Changesets drives releases: pushing to main opens or updates a
# "Version Packages" pull request that collects the pending changesets.
# Merging that pull request publishes to npm, which is what makes
# `bunx @mantaray0/create-stack` resolve the new version.
#
# Authentication is npm trusted publishing (OIDC) — no token is stored here.
# npm is deprecating 2FA-bypassing access tokens: they lose account management
# rights in August 2026 and direct publish rights around January 2027, so a
# token-based release would stop working. Trusted publishing keeps working
# even with "require two-factor authentication and disallow tokens" enabled.
#
# This requires a one-time setup on npmjs.com — see "Releasing" in README.md.
# The workflow file name registered there must stay "release.yml".
on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # Mints the OIDC token npm verifies. Trusted publishing fails without it.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Changesets compares against the base branch, so it needs history.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node >= 22.14.0.
          node-version: "24"
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1. Upgrading explicitly keeps the
      # release independent of whichever npm the Node image happens to bundle.
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@latest

      - run: bun install --frozen-lockfile

      - name: Verify before releasing
        run: |
          bun run lint
          bun run typecheck
          bun run smoke

      - uses: changesets/action@v1
        with:
          version: bun run changeset:version
          publish: bun run changeset:publish
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NPM_TOKEN on purpose: changesets/action falls back to trusted
          # publishing via OIDC when it finds none. Provenance is generated
          # automatically in that mode, so NPM_CONFIG_PROVENANCE is not needed.
